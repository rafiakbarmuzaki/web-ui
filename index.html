<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stok Sekolah Vokasi UI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stok Sekolah Vokasi UI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // HP dengan beberapa kamera belakang: browser sering memilih lensa ultra-wide (0,5x) untuk facingMode "environment".
    // Pilih kamera belakang utama (bukan ultra-wide/macro/tele) sebelum pemindai barcode memakainya.
    (function () {
      var md = navigator.mediaDevices;
      if (!md || !md.getUserMedia || !md.enumerateDevices) return;
      var orig = md.getUserMedia.bind(md);
      var skip = /ultra|wide|0[.,]5|macro|tele|zoom|depth|infrared/i;
      function num(l) { var m = /(\d+)/.exec(l); return m ? parseInt(m[1], 10) : 99; }
      function wantsBack(c) {
        var v = c && c.video;
        if (!v || v === true) return false;
        var f = v.facingMode;
        if (f && typeof f === 'object') f = f.exact || f.ideal;
        if (Array.isArray(f)) f = f[0];
        return f === 'environment' && !v.deviceId;
      }
      async function mainBack() {
        var devs = (await md.enumerateDevices()).filter(function (d) {
          return d.kind === 'videoinput' && /back|rear|environment|belakang/i.test(d.label);
        });
        var good = devs.filter(function (d) { return !skip.test(d.label); });
        good.sort(function (a, b) { return num(a.label) - num(b.label); });
        return good.length && devs.length > 1 ? good[0].deviceId : null;
      }
      md.getUserMedia = async function (c) {
        var stream = await orig(c);
        try {
          if (!wantsBack(c)) return stream;
          var id = await mainBack();
          var cur = stream.getVideoTracks()[0];
          if (!id || !cur || cur.getSettings().deviceId === id) return stream;
          var video = Object.assign({}, c.video);
          delete video.facingMode;
          video.deviceId = { exact: id };
          var better = await orig(Object.assign({}, c, { video: video }));
          stream.getTracks().forEach(function (t) { t.stop(); });
          return better;
        } catch (e) {
          return stream;
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
